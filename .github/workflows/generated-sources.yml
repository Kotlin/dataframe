name: Preview Generated Code

permissions:
  contents: write
  statuses: write

on:
  pull_request:
    types:
      - edited
      - opened
      - synchronize
      - converted_to_draft
      - ready_for_review

jobs:
  build_preview_generated_code:
    name: Build Preview of Generated Code
    # `edited` also fires for closed PRs; don't push preview branches that cleanup has already run for
    if: github.event.pull_request.state == 'open'
    concurrency:
      # Shared with cleanup-generated-sources-preview.yml, so closing the PR cancels and waits for this run
      group: generated-sources-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run Gradle task
        timeout-minutes: 60
        run: ./gradlew clean processKDocsMain korro syncExampleFolders

      - name: Check for changes in generated sources
        id: git-diff
        run: |
          git add './core/generated-sources' './dataframe-csv/generated-sources' './dataframe-json/generated-sources' './dataframe-geo/generated-sources' './dataframe-excel/generated-sources' './dataframe-jdbc/generated-sources' './docs/StardustDocs/resources/snippets' './docs/StardustDocs/topics' './examples/projects'
          echo "changed=$(if git diff --staged --quiet; then echo 'false'; else echo 'true'; fi)" >> $GITHUB_OUTPUT

      - name: Commit and push if changes
        id: git-commit
        if: steps.git-diff.outputs.changed == 'true'
        env:
          # The `pr-<number>/` segment lets cleanup-generated-sources-preview.yml delete this PR's branches once it's closed
          BRANCH: generated-sources/pr-${{ github.event.number }}/docs-update-${{ github.run_number }}
        run: |
          git checkout -b "$BRANCH"
          git commit -m "Update generated sources with recent changes"
          git push origin "$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Update status to PR
        uses: actions/github-script@v9
        if: steps.git-diff.outputs.changed == 'true'
        with:
          # language=js
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: "success",
              target_url: "https://github.com/${{ github.repository }}/commit/${{ steps.git-commit.outputs.commit }}",
              context: "Generated sources will change, merging this PR",
              description: "Check 'Details' to inspect changes ->"
            });
            
